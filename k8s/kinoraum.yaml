# Kinoraum als Webseite im k3s-Cluster.
#
# Zweck: den Fernseher ohne Developer Mode und ohne IPK erreichen - im
# LG-Browser einfach die Adresse aufrufen.
#
# Kein eigenes Container-Abbild: ein initContainer holt den Stand aus dem
# oeffentlichen GitHub-Repo, nginx liefert ihn aus. Aktualisieren heisst
# damit schlicht:  kubectl -n kinoraum rollout restart deploy/kinoraum
#
# Erreichbar ueber einen festen NodePort statt ueber einen Hostnamen: der
# Fernseher hat weder Ziti-Client noch DNS fuer *.benz-sw.de, eine nackte
# IP mit Port funktioniert dagegen immer.
#
# ACHTUNG, bewusst so und nicht anders:
# Die Auslieferung laeuft ueber HTTP. Wer hier einen Jellyfin-Schluessel in
# der App hinterlegt, speichert ihn unverschluesselt im Browser und schickt
# ihn unverschluesselt ueber das LAN. Fuer das Heimnetz vertretbar, fuer
# alles darueber hinaus nicht - die App weist in den Einstellungen darauf hin.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kinoraum
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kinoraum-nginx
  namespace: kinoraum
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /web;
      index index.html;

      # Die interne Knotenadresse hat auf fremden Bildservern nichts zu suchen.
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;

      # Die App haelt ihren Zustand im Adressteil hinter #, der Server sieht
      # davon nichts. Alles Unbekannte auf index.html zurueckfallen lassen.
      location / {
        try_files $uri $uri/ /index.html;
      }

      # Punktdateien nie ausliefern. Der initContainer kopiert zwar nur die
      # App-Dateien, aber das hier ist der Riegel, der auch dann haelt,
      # wenn jemand das Kopieren spaeter aufweicht.
      location ~ /\. {
        deny all;
        return 404;
      }

      # Bilder duerfen liegen bleiben, Skripte nicht.
      # Frueher standen js/css eine Stunde im Zwischenspeicher, waehrend
      # index.html sofort neu kam - nach einem Rollout mischte der Fernseher
      # dann neue Seite mit altem JavaScript. no-cache heisst nicht "nie
      # speichern", sondern "vor dem Benutzen nachfragen": bei unveraenderter
      # Datei antwortet nginx mit 304, es wird also nichts neu uebertragen.
      location ~* \.(jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Referrer-Policy "no-referrer" always;
      }
      location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
      }

      # Sagt, welcher Stand ausgeliefert wird - sonst merkt niemand,
      # dass der Pod auf einem alten Commit haengt.
      location = /VERSION {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      gzip on;
      gzip_types text/css application/javascript application/json image/svg+xml;
      gzip_min_length 1024;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kinoraum
  namespace: kinoraum
  labels:
    app: kinoraum
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0        # beim Rollout nie eine Luecke fuer den Fernseher
      maxSurge: 1
  selector:
    matchLabels:
      app: kinoraum
  template:
    metadata:
      labels:
        app: kinoraum
      annotations:
        kinoraum/source: "github.com/supertony0403/Kinoraum"
    spec:
      # Der Pod spricht nie mit der Kubernetes-API - also auch kein Token.
      automountServiceAccountToken: false
      securityContext:
        # 101 ist der nginx-Benutzer im alpine-Abbild. Alles laeuft unter
        # derselben Kennung, damit die gemeinsamen Volumes beschreibbar sind.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      initContainers:
        - name: fetch
          image: alpine/git:2.45.2
          env:
            - name: HOME
              value: /tmp        # git will ein beschreibbares Zuhause
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Beim Neustart eines Containers laeuft der initContainer erneut,
              # das emptyDir ist dann aber noch gefuellt. "git clone" verweigert
              # ein nicht leeres Ziel - vorher lag der Pod danach dauerhaft still.
              rm -rf /web/* /web/.[!.]* 2>/dev/null || true

              if git clone --depth=1 --single-branch --branch=master \
                   https://github.com/supertony0403/Kinoraum.git /tmp/src 2>/tmp/err; then
                # Nur die App kopieren. Frueher lag der ganze Klon im
                # Wurzelverzeichnis, samt .git und den Manifesten.
                cp -r /tmp/src/index.html /tmp/src/css /tmp/src/js /tmp/src/assets /web/
                (cd /tmp/src && git rev-parse --short HEAD) > /web/VERSION 2>/dev/null || true
                echo "geholt: $(cat /web/VERSION 2>/dev/null)"
                exit 0
              fi

              # GitHub nicht erreichbar: lieber eine ehrliche Seite als ein
              # Pod, der nie hochkommt und einen toten Anschluss hinterlaesst.
              echo "Klonen fehlgeschlagen:" >&2; cat /tmp/err >&2 || true
              cat > /web/index.html <<'HTML'
              <!DOCTYPE html><html lang="de"><meta charset="utf-8">
              <title>Kinoraum nicht verfuegbar</title>
              <style>body{background:#07080c;color:#f2f4f8;font:26px/1.5 system-ui,sans-serif;
              display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
              div{max-width:900px;padding:40px}h1{font-size:48px;margin:0 0 20px}
              p{color:#a4adc2}</style>
              <div><h1>Kinoraum konnte nicht geladen werden</h1>
              <p>Der Server hat den Programmstand nicht von GitHub holen koennen.
              Sobald GitHub wieder erreichbar ist, hilft ein Neustart:</p>
              <p><code>kubectl -n kinoraum rollout restart deploy/kinoraum</code></p></div>
              HTML
              echo "unerreichbar" > /web/VERSION
              exit 0
          volumeMounts:
            - name: web
              mountPath: /web
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: web
              mountPath: /web
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: web
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: conf
          configMap:
            name: kinoraum-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kinoraum
  namespace: kinoraum
spec:
  type: NodePort
  selector:
    app: kinoraum
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
